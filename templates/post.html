{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Detail - OnePage</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600;1,700&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Matching OnePage Custom Styles -->
  <link href="{% static 'assets/css/register_style.css' %}" rel="stylesheet">
</head>

<body>

  <!-- Header / Navigation Bar -->
  <header id="header" class="header">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="/" class="logo">OnePage</a>

      <nav class="d-none d-md-flex align-items-center">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/">About</a>
        <a class="nav-link" href="/">Services</a>
        <a class="nav-link" href="/">Portfolio</a>
        <a class="nav-link" href="/">Team</a>
        <a class="nav-link" href="/">Contact</a>
      </nav>
{% if user.is_authenticated %}
      <a class="btn-get-started" href="/logout">Logout</a>
      {% else %}
        <a class="btn-get-started" href="/login">Login / Sign Up</a>
      {% endif %}
    </div>
  </header>

  <!-- Main Post Section -->
  <main class="register-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">

          <div class="register-card">

            <!-- Post Article -->
            <article class="post-detail">
              
              <!-- Post Title -->
              <h1 class="fw-bold mb-3" style="color: #124265;">{{ post.title }}</h1>

              <!-- Post Meta (Author & Created At) -->
              <div class="d-flex align-items-center text-muted small mb-4 pb-3 border-bottom">
                <span class="me-3">
                  <i class="bi bi-person me-1 text-primary"></i> 
                  <strong>{{ post.author }}</strong>
                </span>
                <span>
                  <i class="bi bi-clock me-1 text-primary"></i> 
                  {{ post.created_at|date:"F j, Y - H:i" }}
                </span>
              </div>

              <!-- Post Body -->
              <div class="post-body text-secondary lh-lg mb-4">
                <p>{{ post.body }}</p>
              </div>

              <!-- Action Links / Navigation -->
              <div class="pt-3 border-top d-flex justify-content-between align-items-center">
                <a href="javascript:history.back()" class="login-link">
                  <i class="bi bi-arrow-left me-1"></i> Back
                </a>
              </div>

            </article>

          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
